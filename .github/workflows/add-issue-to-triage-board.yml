name: 'Add issue/PR to Triage Board'
on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened
permissions: {}
jobs:
  add-to-triage-project-board:
    # skip in fork
    if: github.repository == 'cypress-io/github-action'
    uses: cypress-io/cypress/.github/workflows/triage_add_to_project.yml@ee092e15a7259d4139ad7d31745fdb0674c06609 # develop
    secrets: inherit

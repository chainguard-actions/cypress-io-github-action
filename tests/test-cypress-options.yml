name: Test Cypress run options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: echo "cypress skipped"
          install: false
          browser: chrome
          config: baseUrl=http://localhost:3000
          spec: cypress/e2e/**/*.cy.js
          headed: false
          quiet: true
          env: MY_VAR=hello
          expose: MY_PUBLIC_VAR=world
      - name: Assert action completed
        run: |
          echo "Action completed successfully"
          echo "PASS"

name: Test Cypress run options - browser, spec, config, env, quiet
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: false
          runTests: false
          browser: chrome
          headed: false
          spec: cypress/e2e/**/*.cy.js
          config: baseUrl=http://localhost:3000
          config-file: cypress.config.js
          env: FOO=bar,BAZ=qux
          quiet: true
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with cypress options"
          echo "PASS"

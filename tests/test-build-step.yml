name: Test build step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: false
          runTests: false
          build: touch /tmp/build-ran
      - name: Assert build step ran
        run: |
          echo "Checking build output..."
          if [ ! -f /tmp/build-ran ]; then
            echo "FAIL: build-ran file not found - build step did not execute"
            exit 1
          fi
          echo "PASS: build step ran successfully"

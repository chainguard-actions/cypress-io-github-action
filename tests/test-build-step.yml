name: Test build step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: cypress-io/github-action
      GITHUB_RUN_ID: "1"
      GITHUB_WORKFLOW: test
      GITHUB_SHA: abc123
      GITHUB_SERVER_URL: https://github.com
      GITHUB_API_URL: https://api.github.com
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare build output marker file location
        run: |
          mkdir -p /tmp/build-test

      - id: action
        uses: .
        with:
          install: false
          runTests: false
          build: touch /tmp/build-test/build-output.txt

      - name: Assert build step was executed
        run: |
          if [ ! -f /tmp/build-test/build-output.txt ]; then
            echo "FAIL: build output file not found - build step was not executed"
            exit 1
          fi
          echo "PASS: build step was executed"

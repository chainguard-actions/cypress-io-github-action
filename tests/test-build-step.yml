name: Test build step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with build step and runTests=false
        uses: .
        with:
          install: false
          runTests: false
          build: touch /tmp/build-step-ran.txt

      - name: Assert build step was executed
        run: |
          echo "Checking if build step ran..."
          if [ ! -f /tmp/build-step-ran.txt ]; then
            echo "FAIL: build step marker file not found - build step was not executed"
            exit 1
          fi
          echo "PASS: build step was executed correctly"

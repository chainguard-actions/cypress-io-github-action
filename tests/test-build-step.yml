name: Test build step before tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          install: false
          build: echo "build-step-executed"
          runTests: false
          working-directory: tests/fixtures/cypress-project

      - name: Assert build step ran and action completed
        run: |
          echo "Action completed with build step"
          echo "PASS: build step ran successfully"

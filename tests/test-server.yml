name: Test server options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: false
          runTests: false
          start: "echo server-start"
          start-windows: "echo server-start-windows"
          wait-on: "http://localhost:3000"
          wait-on-timeout: 60
      - name: Assert action completed
        run: |
          echo "Action completed successfully with server options"
          echo "PASS"

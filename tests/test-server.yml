name: Test server and build inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: echo "cypress run with server options"
          build: echo "build step"
          start: echo "start server"
          start-windows: echo "start server windows"
          wait-on: http://localhost:3000
          wait-on-timeout: 60
          install: false
          runTests: true
      - name: Assert action completed
        run: |
          echo "Action completed successfully"
          echo "PASS"

name: Test with publish summary disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal project directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cypress-no-summary"
          cat > "$GITHUB_WORKSPACE/cypress-no-summary/package-lock.json" <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {}
          }
          EOF

      - id: action
        uses: .
        with:
          working-directory: cypress-no-summary
          install: false
          publish-summary: false
          runTests: false

      - name: Assert action completed without summary
        run: |
          echo "Action completed with publish-summary=false"
          echo "PASS: action ran with summary disabled"

name: Test with publish summary disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          install: false
          runTests: false
          publish-summary: false
          working-directory: tests/fixtures/cypress-project

      - name: Assert action completed with summary disabled
        run: |
          echo "Action completed with publish-summary disabled"
          echo "PASS"

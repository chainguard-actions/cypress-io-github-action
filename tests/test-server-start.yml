name: Test server start and wait-on inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: cypress-io/github-action
      GITHUB_RUN_ID: "1"
      GITHUB_WORKFLOW: test
      GITHUB_SHA: abc123
      GITHUB_SERVER_URL: https://github.com
      GITHUB_API_URL: https://api.github.com
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          install: false
          runTests: false
          start: echo server-started
          start-windows: echo server-started-windows
          wait-on: http://localhost:3000
          wait-on-timeout: 30

      - name: Assert action completed with server start options
        run: |
          echo "Action completed with start, start-windows, wait-on, wait-on-timeout inputs"
          echo "PASS"

name: Test start server and wait-on URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean markers
        run: rm -f "$GITHUB_WORKSPACE/server-started.marker" "$GITHUB_WORKSPACE/after-wait.marker"
      - id: action
        uses: .
        with:
          install: false
          start: node tests/fixtures/server.js 8765 server-started.marker
          wait-on: http://localhost:8765
          wait-on-timeout: 30
          command: touch after-wait.marker
      - name: Assert server started and command ran after wait-on
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/server-started.marker" ]; then
            echo "FAIL: start command did not run"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/after-wait.marker" ]; then
            echo "FAIL: test command did not run after wait-on"
            exit 1
          fi
          echo "PASS"

name: Test cloud recording inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: false
          runTests: false
          record: false
          group: my-group
          tag: my-tag
          parallel: false
          ci-build-id: build-123
          auto-cancel-after-failures: 5
      - name: Assert action completed
        run: |
          echo "Action completed successfully"
          echo "PASS"

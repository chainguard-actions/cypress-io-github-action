name: Test cloud options (tag, group, parallel, ci-build-id, auto-cancel-after-failures)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with cloud/recording-related inputs
        id: action
        uses: .
        with:
          install: false
          command: echo "cloud-options-test-executed"
          tag: ci,nightly
          group: integration
          parallel: false
          ci-build-id: build-123
          auto-cancel-after-failures: 5

      - name: Assert action completed successfully
        run: |
          echo "Action completed with cloud option inputs"
          echo "PASS: action ran with cloud options"

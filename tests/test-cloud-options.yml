name: Test cloud recording options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          group: 'my-group'
          tag: 'ci,nightly'
          parallel: false
          ci-build-id: 'build-123'
          auto-cancel-after-failures: 5
          runTests: false
      - name: Assert action ran with cloud recording inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with group/tag/parallel/ci-build-id/auto-cancel-after-failures inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

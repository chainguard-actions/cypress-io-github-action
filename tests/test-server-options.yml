name: Test server and cache options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-key: 'my-custom-cache-key-v1'
          command-prefix: 'npx'
          start: 'echo "server started"'
          start-windows: 'echo "server started on windows"'
          wait-on: 'http://localhost:3000'
          wait-on-timeout: '30'
          install: false
          runTests: false
      - name: Assert action completed
        run: |
          echo "PASS: action completed with server and cache options inputs"

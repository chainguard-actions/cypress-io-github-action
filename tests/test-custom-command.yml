name: Test custom command override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          install: false
          command: echo "custom-command-executed"
          working-directory: tests/fixtures/cypress-project

      - name: Assert custom command was executed
        run: |
          echo "Action completed with custom command"
          echo "PASS: custom command ran successfully"

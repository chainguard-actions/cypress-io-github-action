name: Test custom command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal package-lock.json for the action
        run: |
          cat > /tmp/test-package-lock.json << 'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {}
          }
          EOF
      - id: action
        uses: .
        with:
          install: false
          command: echo "cypress tests would run here"
      - name: Assert action completed with custom command
        run: |
          echo "Action completed successfully with custom command"
          echo "PASS"

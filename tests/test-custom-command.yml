name: Test custom command override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal npm project with custom test script
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cypress-custom-project"
          cd "$GITHUB_WORKSPACE/cypress-custom-project"
          printf '{"name":"test-custom-project","version":"1.0.0","private":true,"scripts":{"custom-test":"echo custom test ran successfully"}}\n' > package.json
          printf '{"name":"test-custom-project","version":"1.0.0","lockfileVersion":3,"requires":true,"packages":{"":{"name":"test-custom-project","version":"1.0.0"}}}\n' > package-lock.json

      - id: action
        uses: .
        with:
          working-directory: ${{ github.workspace }}/cypress-custom-project
          install: false
          command: echo custom-command-executed
          publish-summary: false

      - name: Assert custom command ran
        run: |
          echo "Action completed with custom command override"
          echo "PASS: action ran custom command without invoking Cypress"

name: Test custom command (install skipped)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean markers
        run: rm -f "$GITHUB_WORKSPACE/custom-command.marker"
      - id: action
        uses: .
        with:
          install: false
          command: touch custom-command.marker
      - name: Assert custom command ran in workspace
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/custom-command.marker" ]; then
            echo "FAIL: custom command marker not found"
            exit 1
          fi
          echo "PASS"
      - name: Assert action exported CYPRESS_CACHE_FOLDER and TERM
        run: |
          echo "CYPRESS_CACHE_FOLDER=$CYPRESS_CACHE_FOLDER"
          echo "TERM=$TERM"
          if [ -z "$CYPRESS_CACHE_FOLDER" ]; then
            echo "FAIL: CYPRESS_CACHE_FOLDER not exported"
            exit 1
          fi
          if [ "$TERM" != "xterm" ]; then
            echo "FAIL: TERM not exported as xterm"
            exit 1
          fi
          echo "PASS"

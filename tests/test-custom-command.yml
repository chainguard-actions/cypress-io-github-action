name: Test custom command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with custom command
        uses: .
        with:
          install: false
          command: touch /tmp/custom-command-ran.txt

      - name: Assert custom command was executed
        run: |
          echo "Checking if custom command ran..."
          if [ ! -f /tmp/custom-command-ran.txt ]; then
            echo "FAIL: custom command marker file not found - custom command was not executed"
            exit 1
          fi
          echo "PASS: custom command was executed correctly"

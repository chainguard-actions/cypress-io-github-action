name: Test custom cache-key with install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # skip Cypress binary list/verify/cache since no real Cypress is installed
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare project with lockfile
        run: |
          mkdir -p "$HOME/.npm"
          rm -rf "$GITHUB_WORKSPACE/cache-key-test"
          mkdir -p "$GITHUB_WORKSPACE/cache-key-test"
          cd "$GITHUB_WORKSPACE/cache-key-test"
          echo '{"name":"cache-key-test","version":"1.0.0","lockfileVersion":3,"requires":true,"packages":{"":{"name":"cache-key-test","version":"1.0.0"}}}' > package-lock.json
          echo '{"name":"cache-key-test","version":"1.0.0"}' > package.json
      - id: action
        uses: .
        with:
          working-directory: cache-key-test
          cache-key: my-custom-cache-key-v1
          install-command: touch installed.marker
          command: touch tests-ran.marker
      - name: Assert install and test command ran with custom cache key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          ls -la "$GITHUB_WORKSPACE/cache-key-test"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/cache-key-test/installed.marker" ]; then
            echo "FAIL: install command did not run"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/cache-key-test/tests-ran.marker" ]; then
            echo "FAIL: test command did not run"
            exit 1
          fi
          echo "PASS"

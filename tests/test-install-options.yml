name: Test install options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: false
          runTests: false
          install-command: "npm ci"
          cache-key: "my-custom-cache-key"
          command-prefix: "npx"
          build: "echo build-step"
          working-directory: "."
      - name: Assert action completed
        run: |
          echo "Action completed successfully with install options"
          echo "PASS"

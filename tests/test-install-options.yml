name: Test install options (install-command, cache-key, command-prefix)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: false
          runTests: false
          install-command: echo "custom install"
          cache-key: my-custom-cache-v1
          command-prefix: npx
      - name: Assert action completed with install options
        run: |
          echo "Action completed successfully with install-command/cache-key/command-prefix inputs"
          echo "PASS"

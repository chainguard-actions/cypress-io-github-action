name: Test install and server inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: false
          runTests: false
          install-command: npm ci
          cache-key: my-cache-key
          package-manager-cache: false
          command-prefix: npx
          project: .
          expose: MY_VAR=value
          start: echo start-server
          start-windows: echo start-server-windows
          wait-on: http://localhost:3000
          wait-on-timeout: 60
      - name: Assert action completed
        run: |
          echo "Action completed successfully"
          echo "PASS"

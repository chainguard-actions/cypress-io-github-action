name: Test basic usage with command override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: echo "cypress skipped"
          install: false
          runTests: true
          working-directory: .
          publish-summary: false
          summary-title: "Test Summary"
          package-manager-cache: false
      - name: Assert action completed
        run: |
          echo "Action completed successfully"
          echo "PASS"

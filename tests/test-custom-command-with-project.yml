name: Test custom command with project directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: false
          command: echo "custom cypress command executed"
          working-directory: tests/fixtures/minimal-project
      - name: Assert action completed with custom command
        run: |
          echo "Action completed successfully with custom command and working-directory"
          echo "PASS"

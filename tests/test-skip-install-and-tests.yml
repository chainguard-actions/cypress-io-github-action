name: Test skip install and skip tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal project directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cypress-test-project"
          # Create a minimal package-lock.json so the action can detect npm
          cat > "$GITHUB_WORKSPACE/cypress-test-project/package-lock.json" <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {}
          }
          EOF

      - id: action
        uses: .
        with:
          working-directory: cypress-test-project
          install: false
          runTests: false

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS: action ran with install=false and runTests=false"

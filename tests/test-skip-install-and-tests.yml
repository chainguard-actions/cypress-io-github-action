name: Test skip install and skip tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          install: false
          runTests: false
          working-directory: tests/fixtures/cypress-project

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully (install and tests were skipped)"
          echo "PASS"

name: Test skip install and tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with install=false and runTests=false
        uses: .
        with:
          install: false
          runTests: false

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS: install=false and runTests=false scenario works"

name: Test config and env inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          install: false
          runTests: false
          config: baseUrl=http://localhost:3000
          env: MY_VAR=hello

      - name: Assert action completed with config and env inputs
        run: |
          echo "PASS: action ran with config and env inputs"

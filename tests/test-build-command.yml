name: Test build command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          install: false
          runTests: false
          build: touch /tmp/build-ran

      - name: Assert build command ran
        run: |
          if [ ! -f /tmp/build-ran ]; then
            echo "FAIL: build command did not run (marker file not found)"
            exit 1
          fi
          echo "PASS: build command ran successfully"

name: Test build command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with build command and no install or tests
        id: action
        uses: .
        with:
          install: false
          runTests: false
          build: sh tests/fixtures/build-test/build.sh

      - name: Assert build command was executed
        run: |
          if [ ! -f /tmp/cypress-action-build-ran.txt ]; then
            echo "FAIL: build command did not create the expected marker file"
            exit 1
          fi
          echo "PASS: build command was executed successfully"

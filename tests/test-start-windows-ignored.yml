name: Test start-windows is ignored on Linux and summary-title ignored with command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean markers
        run: rm -f "$GITHUB_WORKSPACE/windows-start.marker" "$GITHUB_WORKSPACE/linux-start.marker" "$GITHUB_WORKSPACE/sw-tests.marker"
      - id: action
        uses: .
        with:
          install: false
          start: touch linux-start.marker
          start-windows: touch windows-start.marker
          wait-on: sleep 2
          summary-title: My Custom Summary
          command: touch sw-tests.marker
      - name: Assert Linux start used, Windows start skipped
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/windows-start.marker" ]; then
            echo "FAIL: start-windows command ran on Linux"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/linux-start.marker" ]; then
            echo "FAIL: start command did not run"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/sw-tests.marker" ]; then
            echo "FAIL: test command did not run"
            exit 1
          fi
          echo "PASS"

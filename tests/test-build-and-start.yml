name: Test build and start server options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: echo "cypress skipped"
          install: false
          build: echo "build step"
          start: echo "start server"
          start-windows: echo "start server windows"
          wait-on: "http://localhost:3000"
          wait-on-timeout: 30
          command-prefix: npx
          install-command: npm ci
          cache-key: "my-cache-key"
          project: .
          config-file: ""
      - name: Assert action completed
        run: |
          echo "Action completed successfully"
          echo "PASS"

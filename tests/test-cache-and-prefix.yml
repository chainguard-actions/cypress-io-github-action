name: Test cache-key and command-prefix inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with cache-key and command-prefix inputs
        id: action
        uses: .
        with:
          install: false
          command: echo "cache-prefix-test-executed"
          cache-key: my-custom-cache-key-v1
          command-prefix: npx

      - name: Assert action completed successfully
        run: |
          echo "Action completed with cache-key and command-prefix inputs"
          echo "PASS: action ran with cache-key and command-prefix"

name: Test with package manager cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal project directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cypress-no-cache"
          cat > "$GITHUB_WORKSPACE/cypress-no-cache/package-lock.json" <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {}
          }
          EOF

      - id: action
        uses: .
        with:
          working-directory: cypress-no-cache
          install: false
          package-manager-cache: false
          runTests: false

      - name: Assert action completed without cache
        run: |
          echo "Action completed with package-manager-cache=false"
          echo "PASS: action ran with caching disabled"

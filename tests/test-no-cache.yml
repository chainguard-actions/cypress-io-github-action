name: Test with package manager cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal npm project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/no-cache-project"
          cd "$GITHUB_WORKSPACE/no-cache-project"
          printf '{"name":"no-cache-project","version":"1.0.0","private":true}\n' > package.json
          printf '{"name":"no-cache-project","version":"1.0.0","lockfileVersion":3,"requires":true,"packages":{"":{"name":"no-cache-project","version":"1.0.0"}}}\n' > package-lock.json

      - id: action
        uses: .
        with:
          working-directory: ${{ github.workspace }}/no-cache-project
          install: false
          runTests: false
          package-manager-cache: false
          publish-summary: false

      - name: Assert action completed with cache disabled
        run: |
          echo "Action completed successfully with package-manager-cache=false"
          echo "PASS: action ran without error when caching is disabled"

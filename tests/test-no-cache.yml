name: Test package-manager-cache false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with package-manager-cache=false and runTests=false
        uses: .
        with:
          install: false
          runTests: false
          package-manager-cache: false

      - name: Assert action completed successfully without cache
        run: |
          echo "Action completed successfully with package-manager-cache=false"
          echo "PASS: package-manager-cache=false scenario works"

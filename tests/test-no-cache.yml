name: Test no package manager cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          install: false
          runTests: false
          package-manager-cache: false

      - name: Assert action completed with caching disabled
        run: |
          echo "PASS: action ran with package-manager-cache=false"

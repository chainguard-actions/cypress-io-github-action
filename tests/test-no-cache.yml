name: Test with package manager cache disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          install: false
          runTests: false
          package-manager-cache: false
          working-directory: tests/fixtures/cypress-project

      - name: Assert action completed with cache disabled
        run: |
          echo "Action completed with package-manager-cache disabled"
          echo "PASS"

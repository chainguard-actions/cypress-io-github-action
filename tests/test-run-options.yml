name: Test run options (browser, headed, quiet, spec, config)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with browser, headed, quiet, spec, config inputs
        id: action
        uses: .
        with:
          install: false
          command: echo "run-options-test-executed"
          browser: chrome
          headed: false
          quiet: true
          spec: cypress/e2e/**/*.cy.js
          config: baseUrl=http://localhost:3000

      - name: Assert action completed successfully
        run: |
          echo "Action completed with browser/headed/quiet/spec/config inputs"
          echo "PASS: action ran with run options"

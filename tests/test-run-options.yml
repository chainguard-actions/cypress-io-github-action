name: Test run options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: false
          runTests: false
          browser: chrome
          spec: "cypress/e2e/**/*.cy.js"
          config: "baseUrl=http://localhost:3000"
          env: "MY_VAR=hello"
          headed: false
          quiet: true
          project: "."
      - name: Assert action completed
        run: |
          echo "Action completed successfully with run options"
          echo "PASS"

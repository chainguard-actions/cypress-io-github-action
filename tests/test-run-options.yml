name: Test run options (browser, headed, quiet, spec, config)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install: false
          command: echo "cypress run options test"
          browser: chrome
          headed: false
          quiet: true
          spec: cypress/e2e/**/*.cy.js
          config: baseUrl=http://localhost:3000
      - name: Assert action completed with run options
        run: |
          echo "Action completed successfully with browser/headed/quiet/spec/config inputs"
          echo "PASS"

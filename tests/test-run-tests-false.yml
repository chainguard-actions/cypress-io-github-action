name: Test runTests false skips test command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean markers
        run: rm -f "$GITHUB_WORKSPACE/should-not-exist.marker" "$GITHUB_WORKSPACE/build-ran.marker"
      - id: action
        uses: .
        with:
          install: false
          runTests: false
          build: touch build-ran.marker
          command: touch should-not-exist.marker
      - name: Assert build ran but tests were skipped
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/build-ran.marker" ]; then
            echo "FAIL: build command did not run"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/should-not-exist.marker" ]; then
            echo "FAIL: test command ran although runTests=false"
            exit 1
          fi
          echo "PASS"

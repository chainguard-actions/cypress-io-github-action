name: Test install fails when lockfile is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean markers
        run: rm -rf /tmp/cypress-markers
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: tests/fixtures/no-lockfile
          command: bash ../write-marker.sh should-not-run
      - name: Assert action failed before running command
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          if [ -f /tmp/cypress-markers/should-not-run ]; then
            echo "FAIL: command ran despite missing lockfile"
            exit 1
          fi
          echo "PASS"

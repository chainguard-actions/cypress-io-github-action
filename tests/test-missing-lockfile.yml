name: Test install fails without a lockfile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Reset marker
        run: rm -f "${{ runner.temp }}/marker.txt"
      - id: action
        uses: .
        continue-on-error: true
        env:
          MARKER_FILE: ${{ runner.temp }}/marker.txt
        with:
          working-directory: tests/fixtures/no-lockfile
          command: bash ../scripts/write-marker.sh custom-command
      - name: Assert action failed and command did not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure due to missing lockfile"
            exit 1
          fi
          if [ -f "${{ runner.temp }}/marker.txt" ]; then
            echo "FAIL: test command ran despite install failure"
            exit 1
          fi
          echo "PASS"

name: Test failing custom command fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare working directory
        run: |
          D="$GITHUB_WORKSPACE/cypress-fail"
          rm -rf "$D"
          mkdir -p "$D"
          cat > "$D/fail.sh" <<'EOF'
          #!/bin/bash
          echo "ran" > fail-ran.txt
          exit 3
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          install: false
          working-directory: cypress-fail
          command: bash fail.sh
      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ ! -f "$GITHUB_WORKSPACE/cypress-fail/fail-ran.txt" ]; then
            echo "FAIL: command did not run"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome when command exits non-zero"
            exit 1
          fi
          echo "PASS"

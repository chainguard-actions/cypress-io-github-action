name: Test working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create working directory
        run: mkdir -p "$GITHUB_WORKSPACE/my-app"

      - id: action
        uses: .
        with:
          working-directory: my-app
          install: false
          runTests: false

      - name: Assert action completed with working directory
        run: |
          echo "PASS: action ran with custom working-directory"

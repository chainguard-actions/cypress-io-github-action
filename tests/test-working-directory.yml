name: Test working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: cypress-io/github-action
      GITHUB_RUN_ID: "1"
      GITHUB_WORKFLOW: test
      GITHUB_SHA: abc123
      GITHUB_SERVER_URL: https://github.com
      GITHUB_API_URL: https://api.github.com
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a working directory with a package-lock.json
        run: |
          mkdir -p /tmp/cypress-test-project
          cat > /tmp/cypress-test-project/package.json << 'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "devDependencies": {}
          }
          EOF
          cat > /tmp/cypress-test-project/package-lock.json << 'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "test-project",
                "version": "1.0.0",
                "devDependencies": {}
              }
            }
          }
          EOF

      - id: action
        uses: .
        with:
          install: false
          runTests: false
          working-directory: /tmp/cypress-test-project

      - name: Assert action completed with working-directory
        run: |
          echo "Action completed with custom working-directory"
          echo "PASS"

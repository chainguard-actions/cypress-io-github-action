name: Test working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run action with working-directory set to fixture subdirectory
        uses: .
        with:
          working-directory: tests/fixtures/basic-project
          install: false
          runTests: false

      - name: Assert action completed with correct working directory
        run: |
          echo "Action completed successfully with working-directory=tests/fixtures/basic-project"
          echo "PASS: working-directory scenario works"
